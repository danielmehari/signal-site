name: hourly

on:
  schedule:
    - cron: "5 * * * *"   # በየሰዓቱ ሻማ ከተዘጋ ከ5 ደቂቃ በኋላ (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BINANCE_TESTNET_KEY: ${{ secrets.BINANCE_TESTNET_KEY }}
      BINANCE_TESTNET_SECRET: ${{ secrets.BINANCE_TESTNET_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - run: python hourly_tracker.py
      - run: python testnet_copier.py
        continue-on-error: true
      - name: Save results
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "hourly $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
