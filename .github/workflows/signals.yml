name: signals

on:
  schedule:
    - cron: "3 */4 * * *"   # በየ4 ሰዓት ሻማ ከተዘጋ ከ3 ደቂቃ በኋላ (UTC)
  workflow_dispatch:         # በእጅ ለማሄድ

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - run: python signal_engine.py
      - name: Save results
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "update $(date -u +'%Y-%m-%d %H:%M')"
          git push
