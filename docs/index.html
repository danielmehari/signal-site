let lg="am";try{lg=localStorage.getItem("lg")||"am"}catch(e){}
const NM=T=>({bh:"Buy & Hold",don:"Donchian 55/20",ema:"EMA 50/200",cand:T.cand}),COL={bh:"var(--mu)",don:"#b7791f",ema:"#8b5cf6",cand:"var(--b)"};
const pc=(x,d=0)=>x==null?"–":(x*100).toFixed(d)+"%";
function render(){const T=I[lg],N=NM(T);
 document.documentElement.lang=lg;$("#h").textContent=T.h;document.title=T.h;$("#lg").textContent=lg==="am"?"English":"አማርኛ";
 $("#ck").textContent=T.chk+D.checked;$("#ex").textContent=T.ex;$("#wn").innerHTML=T.warn;
 $("#h1").textContent=T.h1+D.asof+")";
 const pw=(w,k)=>k==="cand"?pc(w,0):w>0?T.inn:T.out;
 $("#pos").innerHTML=`<table><thead><tr><th>${T.coin}</th><th>${T.price}</th><th>${T.tr}</th><th>${N.cand}</th><th>Donchian</th><th>EMA</th></tr></thead><tbody>${Object.entries(D.coins).map(([s,m])=>`<tr><td>${s.replace("USDT","")}</td><td>${Number(m.price).toLocaleString("en-US",{maximumFractionDigits:4})}</td><td class="${m.up?"g":"r"}">${m.up==null?"–":m.up?"↑ "+T.up:"↓ "+T.dn}</td><td>${pw(m.w.cand,"cand")}</td><td>${pw(m.w.don)}</td><td>${pw(m.w.ema)}</td></tr>`).join("")}</tbody></table>`;
 $("#h2").textContent=T.h2;
 const all=KS.flatMap(k=>D.eq[k]),lo=Math.log(Math.min(...all)),hi=Math.log(Math.max(...all)),n=D.dates.length,X=i=>(i/(n-1)*600).toFixed(1),Y=v=>(205-(Math.log(v)-lo)/(hi-lo||1)*195).toFixed(1);
 const fi=D.dates.findIndex(d=>d>=D.live_start),li=fi<0?n-1:fi;
 $("#chart").innerHTML=`<svg viewBox="0 0 600 215" role="img" aria-label="${T.h2}">${KS.map(k=>`<polyline fill="none" stroke="${COL[k]}" stroke-width="${k==="cand"?2.4:1.4}" points="${D.eq[k].map((v,i)=>X(i)+","+Y(v)).join(" ")}"/>`).join("")}<line x1="${X(li)}" x2="${X(li)}" y1="0" y2="215" stroke="var(--tx)" stroke-dasharray="4 4"/><text x="${Math.min(+X(li)+4,520)}" y="12" font-size="11" fill="var(--tx)">${T.live}</text></svg><div class="lg">${KS.map(k=>`<span><i style="background:${COL[k]}"></i>${N[k]}</span>`).join("")}</div>`;
 $("#cn").textContent=T.cn;$("#h3").textContent=T.h3;
 $("#st").innerHTML=`<table><thead><tr><th>${T.s}</th><th>${T.sh}</th><th>${T.an}</th><th>${T.dd}</th><th>${T.exp}</th><th>${T.lv}</th></tr></thead><tbody>${KS.map(k=>{const s=D.stats[k],h=s.hist||{};return `<tr><td>${N[k]}</td><td>${h.sh??"–"}</td><td>${pc(h.ann)}</td><td>${pc(h.dd)}</td><td>${pc(s.exp)}</td><td>${s.live.days} / ${pc(s.live.ret,1)} / ${pc(s.live.dd,1)}</td></tr>`}).join("")}</tbody></table>`;
 $("#nt").textContent=T.nt}
$("#lg").onclick=()=>{lg=lg==="am"?"en":"am";try{localStorage.setItem("lg",lg)}catch(e){}render()};
render();
